[project]
name = "hexlet-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MandosGrogu", email = "jpinkmann@mail.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "css>=0.1",
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "django-filter>=26.1",
    "django-tailwind-cli>=4.8.0",
    "gunicorn>=26.2.0",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.3",
    "sentry-sdk>=2.69.1",
    "tailwind>=3.1.5b0",
    "whitenoise>=6.12.0",
]

[project.scripts]
python-project-52 = "python_project_52:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "sqlite-utils>=4.2.1",
]
