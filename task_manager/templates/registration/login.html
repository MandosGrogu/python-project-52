{% extends "base.html" %}
{% load i18n %}
{% block content %}
<main class="mx-[11%] p-4 mt-6">
      <h1 class="text-2xl font-bold">{% translate "Log in" %}</h1>
      <form action="{% url 'login' %}" method="POST">
          {% csrf_token %}
          <div class="w-1/2 pt-4 pb-4">{{ form.as_p }}</div>
          <button class="inline-block px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-normal text-medium rounded-lg transition-colors text-center" type="submit">{% translate "Log in" context "button label" %}</button>
      </form>
  </main>
  {% endblock %}
