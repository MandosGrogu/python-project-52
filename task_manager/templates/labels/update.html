{% extends "base.html" %}
{% load i18n %}
{% block content %}
<main class="mx-[11%] p-4 mt-6">
            <h1 class="text-2xl font-bold">{% translate "Label" %}</h1>
      <form action="{% url 'label_update' ID %}" method="POST">
          {% csrf_token %}
          <div class="w-1/2 pt-4 pb-4">
            {% for field in form %}
                <div class="form-group" style="margin-bottom: 15px;">
                    {{ field.label_tag }}
                    {% if field.help_text %}
                        <small class="form-text" style="display: block; margin-bottom: 5px;">
                            <p class="text-base text-gray-500 font-light">{{ field.help_text }}</p>
                        </small>
                    {% endif %}
                    {{ field }}
                </div>
            {% endfor %}</div>
          <button class="inline-block px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-normal text-medium rounded-lg transition-colors text-center" type="submit">{% translate "Update" %}</button>
      </form>
  </main>
  {% endblock %}
